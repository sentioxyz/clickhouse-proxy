syntax = "proto3";

package rewriter;
option go_package = "github.com/sentioxyz/clickhouse-proxy/protos";

enum RewriteOp {
    TableNameRewrite = 0;
    LimitRewrite = 1;
    OffsetRewrite = 2;
    SettingsRewrite = 3;
    CommonTableExprRewrite = 4;
    DatabaseNameRewrite = 5;
    ShowTablesRewrite = 6;
}

message RewriteTableNameArgs {
    message RemoteTable {
        string addr = 1;
        string database = 2;
        string table = 3;
        string user = 4;
        string password = 5;
    }
    message TableWithDatabase {
        string database = 1;
        string table = 2;
    }
    map<string, string> table_map = 1;
    map<string, RemoteTable> remote_table_map = 2;
    map<string, TableWithDatabase> table_with_database_map = 3;
}

message RewriteLimitArgs {
    int32 limit = 1 [deprecated = true];

    message ReplaceLimit {
        int32 threshold = 1;
        int32 replace_to = 2;
    }
    oneof value {
        ReplaceLimit replace_limit = 2;
        int32 force_limit = 3;
    }
}

message RewriteOffsetArgs {
    int32 offset = 1;
}

message RewriteCommonTableExprArgs {
    message CommonTableExpr {
        string alias = 1;
        string sql = 2;
    }
    map<string, CommonTableExpr> cte_map = 1;
}

// DatabaseNameRewrite rewrites USE <db> statements.
// The map key is the virtual database name (e.g. processorID),
// value is the physical database name.
message RewriteDatabaseNameArgs {
    map<string, string> database_map = 1;
}

// ShowTablesRewrite rewrites SHOW TABLES into a filtered SELECT.
// processor_id is used as prefix filter for table names.
message RewriteShowTablesArgs {
    string database = 1;        // physical database to query
    string processor_id = 2;    // processor prefix for LIKE filter
}

enum SettingType {
    String = 0;
    Bool = 1;
    Int = 2;
    Uint64 = 3;
}

message RewriteSettingsArgs {
    message Setting {
        string key = 1;
        SettingType type = 2;
        oneof value {
            string string_value = 3;
            bool bool_value = 4;
            int32 int_value = 5;
            uint64 uint64_value = 6;
        }
    }
    repeated Setting settings = 1;
}

message RewriteOption {
    RewriteOp op = 1;
    oneof value {
        RewriteTableNameArgs table_name_args = 2;
        RewriteLimitArgs limit_args = 3;
        RewriteOffsetArgs offset_args = 4;
        RewriteSettingsArgs settings_args = 5;
        RewriteCommonTableExprArgs common_table_expr_args = 6;
        RewriteDatabaseNameArgs database_name_args = 7;
        RewriteShowTablesArgs show_tables_args = 8;
    }
}

message RewriteSQLRequest {
    string sql = 1;
    repeated RewriteOption options = 2;
}

enum RewriteCode {
    Success = 0;
    SyntaxError = 1;
    RewriteError = 2;
}

message RewriteSQLResponse {
    RewriteCode code = 1;
    string message = 2;
    string sql_after_rewrite = 3;
    repeated string original_accessed_table_names = 4;
    string statement_type = 5;  // "SELECT", "USE", "SHOW_TABLES", etc.
}

service RewriterService {
    rpc Rewrite (RewriteSQLRequest) returns (RewriteSQLResponse) {}
    rpc RewriteErrorMessage (RewriteErrorMessageRequest) returns (RewriteErrorMessageResponse) {}
}

message RewriteErrorMessageRequest {
    string sql = 1;
    string error_message = 2;
    repeated RewriteOption options = 3;
}

message RewriteErrorMessageResponse {
    RewriteCode code = 1;
    string message = 2;
    string error_after_rewrite = 3;
}
